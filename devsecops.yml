name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile source
        run: python -m compileall -q app.py inventory.py menu.py reports.py validators.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sast-scan:
    name: SAST Scan and Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install --upgrade bandit
      - name: Run Bandit and enforce Quality Gate
        run: bandit -r . -c bandit.yaml -ll
